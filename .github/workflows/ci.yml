name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: SenseCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/SenseCore

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SenseCore
        run: swift test --package-path Packages/SenseCore
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project SENSE.xcodeproj \
            -scheme SENSE \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
